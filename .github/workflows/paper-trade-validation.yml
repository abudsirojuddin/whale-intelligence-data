name: Paper Trade Validation

on:
  workflow_dispatch:
  schedule:
    - cron: '7,27,47 * * * *'

permissions:
  contents: write

concurrency:
  group: paper-trade-validation
  cancel-in-progress: false

jobs:
  paper-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate syntax
        run: python -m py_compile scripts/paper_trading.py
      - name: Update forward-only paper journal
        run: python scripts/paper_trading.py
      - name: Commit paper journal and performance
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper_trades.json paper_performance.json
          if ! git diff --cached --quiet; then
            git commit -m "data: record prospective paper signals [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
