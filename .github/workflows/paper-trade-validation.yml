name: Paper Trade Validation

on:
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'

permissions:
  contents: write

concurrency:
  group: whale-research-writes
  cancel-in-progress: false

jobs:
  paper-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate syntax
        run: python -m py_compile scripts/paper_trading.py
      - name: Offline unit tests
        run: python scripts/test_paper_trading.py
      - name: Update forward-only paper journal
        run: python scripts/paper_trading.py
      - name: Notify closed simulations
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/test_notify_paper_results.py
          python scripts/notify_paper_results.py
      - name: Commit paper journal and performance
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper_trades.json paper_performance.json paper_result_state.json
          if ! git diff --cached --quiet; then
            git commit -m "data: record prospective paper signals [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
