name: Intraday Intelligence V2 Paper Research

on:
  workflow_dispatch:
  schedule:
    - cron: '2,17,32,47 * * * *'

permissions:
  contents: write

concurrency:
  group: intraday-paper-research
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline deterministic tests
        run: |
          python -m py_compile scripts/intraday_scanner.py scripts/test_intraday_scanner.py
          python scripts/test_intraday_scanner.py
      - name: Binance Futures paper-only intraday scan
        env:
          ENABLE_INTRADAY_PAPER_ALERTS: ${{ vars.ENABLE_INTRADAY_PAPER_ALERTS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/intraday_scanner.py
      - name: Persist paper research output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add intraday_scan.json intraday_signals.json intraday_state.json
          if ! git diff --cached --quiet; then
            git commit -m "data: intraday paper market scan [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
