name: Binance Futures WebSocket Payload Test

on:
  push:
    branches:
      - feature/intraday-intelligence-v2-20261020
    paths:
      - "scripts/binance_ws_probe.py"
      - "scripts/test_binance_ws_probe.py"
      - ".github/workflows/binance-ws-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install WebSocket client
        run: python -m pip install websocket-client==1.8.0
      - name: Offline event tests
        run: |
          python -m py_compile scripts/binance_ws_probe.py scripts/test_binance_ws_probe.py
          python scripts/test_binance_ws_probe.py
      - name: Verify actual Binance Futures public streaming data
        run: python scripts/binance_ws_probe.py
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binance-ws-payload-${{ github.run_id }}
          path: binance_ws_probe.json
          retention-days: 7
