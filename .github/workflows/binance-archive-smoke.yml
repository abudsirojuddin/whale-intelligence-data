name: Binance Vision Archive Smoke Test

on:
  push:
    branches:
      - feature/intraday-intelligence-v2-20261020
    paths:
      - "scripts/binance_history_collector.py"
      - "scripts/test_binance_history_collector.py"
      - ".github/workflows/binance-archive-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline schema tests
        run: |
          python -m py_compile scripts/binance_history_collector.py scripts/test_binance_history_collector.py
          python scripts/test_binance_history_collector.py
      - name: Download a delayed complete day of official USD-M candles
        run: python scripts/binance_history_collector.py --symbols BTCUSDT --days 1
      - name: Upload archive quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binance-archive-smoke-${{ github.run_id }}
          path: binance_archive_history.json
          retention-days: 7
