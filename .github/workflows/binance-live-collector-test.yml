name: Binance Futures Closed Candle Collector Test
on:
  push:
    branches:
      - feature/intraday-intelligence-v2-20261020
    paths:
      - "scripts/binance_live_collector.py"
      - "scripts/test_binance_live_collector.py"
      - ".github/workflows/binance-live-collector-test.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned public WebSocket library
        run: python -m pip install websocket-client==1.8.0
      - name: Verify collector rules offline
        run: |
          python -m py_compile scripts/binance_live_collector.py scripts/test_binance_live_collector.py
          python scripts/test_binance_live_collector.py
      - name: Probe Binance Futures for 75 seconds — no deployment
        run: python scripts/binance_live_collector.py --seconds 75 --symbols BTCUSDT
      - name: Upload closed candle diagnostic (no writes to main)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binance-candle-collector-${{ github.run_id }}
          path: |
            binance_live_candles.json
            binance_live_diagnostics.json
          retention-days: 7
