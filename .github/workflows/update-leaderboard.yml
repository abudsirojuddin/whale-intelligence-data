name: Update Smart Money Candidates

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: update-smart-money-candidates
  cancel-in-progress: false

jobs:
  update-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read leaderboard and screen public candidates
        run: python scripts/update_candidates.py
      - name: Commit candidate snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh candidate snapshot"
            git push
          fi
