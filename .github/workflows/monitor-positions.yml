name: Monitor Whale Positions

on:
  workflow_dispatch:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'

permissions:
  contents: write

concurrency:
  group: whale-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check position snapshots
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCH_TOP_N: '10'
          MIN_ALERT_NOTIONAL_USD: '10000'
        run: python scripts/monitor_positions.py
      - name: Save latest monitoring results
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add position_state.json alerts.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update public wallet position snapshots [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
