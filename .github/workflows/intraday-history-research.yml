name: Intraday V2 Historical Pattern Research
on:
  push:
    branches:
      - feature/intraday-intelligence-v2-20261020
    paths:
      - "scripts/intraday_historical_diagnostic.py"
      - ".github/workflows/intraday-history-research.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate syntax
        run: python -m py_compile scripts/intraday_scanner.py scripts/binance_history_collector.py scripts/intraday_historical_diagnostic.py
      - name: Download verified delayed Binance Futures archive
        run: python scripts/binance_history_collector.py --symbols BTCUSDT --days 14
      - name: Run non-executable conservative pattern diagnostic
        run: python scripts/intraday_historical_diagnostic.py
      - name: Save research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intraday-historical-research-${{ github.run_id }}
          path: intraday_historical_diagnostic.json
          retention-days: 7
