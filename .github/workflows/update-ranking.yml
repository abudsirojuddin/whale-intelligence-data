name: Update Trader Quality Ranking

on:
  workflow_dispatch:
  schedule:
    - cron: '37 */6 * * *'

permissions:
  contents: write

concurrency:
  group: trader-quality-ranking
  cancel-in-progress: false

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Calculate observable closing-order performance
        run: python scripts/rank_traders.py
      - name: Save ranking snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ranking.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh trader quality ranking [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
